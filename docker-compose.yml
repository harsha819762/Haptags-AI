services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: haptags
      POSTGRES_PASSWORD: haptags_dev
      POSTGRES_DB: haptags
    ports:
      - "5432:5432"
    volumes:
      - haptags_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - haptags_redis_data:/data

volumes:
  haptags_pg_data:
  haptags_redis_data:
